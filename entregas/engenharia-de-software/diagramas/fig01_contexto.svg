<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="1400" height="900" fill="#fff"/>
<ellipse cx="700" cy="450" rx="230" ry="120" fill="#EEF2FA" stroke="#1F3864" stroke-width="2.5"/>
<text x="700" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3864">Trabalho estudado:</text>
<text x="700" y="438" text-anchor="middle" font-size="21" font-weight="400" fill="#1F3864">registro e acompanhamento das</text>
<text x="700" y="466" text-anchor="middle" font-size="21" font-weight="400" fill="#1F3864">demandas de articulação de rede</text>
<text x="700" y="494" text-anchor="middle" font-size="21" font-weight="400" fill="#1F3864">do CRIE (com o sistema web)</text>
<rect x="40" y="60" width="300" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="190.0" y="89" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Direção do CRIE</text>
<text x="190.0" y="112" text-anchor="middle" font-size="16" font-weight="400" fill="#222">cliente; perfil Direção</text>
<rect x="1060" y="60" width="300" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1210.0" y="89" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Profissionais do CRIE</text>
<text x="1210.0" y="112" text-anchor="middle" font-size="16" font-weight="400" fill="#222">assistente social, equipe pedagógica</text>
<rect x="40" y="740" width="330" height="100" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="205.0" y="769" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Rede de serviços públicos</text>
<text x="205.0" y="792" text-anchor="middle" font-size="16" font-weight="400" fill="#222">CRAS, CAPSi, UBS, escola, conselho</text>
<text x="205.0" y="815" text-anchor="middle" font-size="16" font-weight="400" fill="#222">(sem integração com o sistema)</text>
<rect x="1060" y="750" width="300" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1210.0" y="779" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Família da pessoa atendida</text>
<text x="1210.0" y="802" text-anchor="middle" font-size="16" font-weight="400" fill="#222">(não usa o sistema)</text>
<rect x="560" y="40" width="280" height="80" rx="4" fill="#fff" stroke="#222" stroke-width="2" stroke-dasharray="8 6"/>
<text x="700.0" y="69" text-anchor="middle" font-size="20" font-weight="700" fill="#222">Prefeitura de Extrema</text>
<text x="700.0" y="92" text-anchor="middle" font-size="16" font-weight="400" fill="#222">fora do escopo (seção 8a)</text>
<line x1="320" y1="140" x2="560" y2="345" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="470" y="200" text-anchor="start" font-size="17" fill="#222">cadastro de profissionais,</text>
<text x="470" y="221" text-anchor="start" font-size="17" fill="#222">pedido de relatório,</text>
<text x="470" y="242" text-anchor="start" font-size="17" fill="#222">decisão de acesso</text>
<line x1="480" y1="420" x2="150" y2="140" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="290" y="330" text-anchor="end" font-size="17" fill="#222">painel de pendências,</text>
<text x="290" y="351" text-anchor="end" font-size="17" fill="#222">relatórios do período,</text>
<text x="290" y="372" text-anchor="end" font-size="17" fill="#222">registros de auditoria</text>
<line x1="1080" y1="140" x2="840" y2="345" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="915" y="205" text-anchor="end" font-size="17" fill="#222">demandas, andamento,</text>
<text x="915" y="226" text-anchor="end" font-size="17" fill="#222">anotações, evoluções,</text>
<text x="915" y="247" text-anchor="end" font-size="17" fill="#222">encaminhamentos</text>
<line x1="920" y1="420" x2="1250" y2="140" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="1110" y="330" text-anchor="start" font-size="17" fill="#222">aviso de prazo,</text>
<text x="1110" y="351" text-anchor="start" font-size="17" fill="#222">minhas demandas,</text>
<text x="1110" y="372" text-anchor="start" font-size="17" fill="#222">histórico consultado</text>
<line x1="540" y1="535" x2="300" y2="740" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="430" y="650" text-anchor="start" font-size="17" fill="#222">encaminhamento</text>
<text x="430" y="671" text-anchor="start" font-size="17" fill="#222">(ofício, ligação, visita)</text>
<line x1="120" y1="740" x2="490" y2="505" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="225" y="600" text-anchor="end" font-size="17" fill="#222">retorno da rede</text>
<text x="225" y="621" text-anchor="end" font-size="17" fill="#222">(registrado como</text>
<text x="225" y="642" text-anchor="end" font-size="17" fill="#222">desfecho)</text>
<line x1="1280" y1="750" x2="910" y2="505" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="1175" y="640" text-anchor="start" font-size="17" fill="#222">pedido de informação</text>
<text x="1175" y="661" text-anchor="start" font-size="17" fill="#222">sobre o que já foi feito</text>
<line x1="860" y1="560" x2="1100" y2="750" stroke="#222" stroke-width="1.6" marker-end="url(#seta)"/>
<text x="960" y="680" text-anchor="end" font-size="17" fill="#222">resposta da equipe</text>
<text x="960" y="701" text-anchor="end" font-size="17" fill="#222">a partir do histórico</text>
<line x1="700" y1="330" x2="700" y2="122" stroke="#222" stroke-width="1.6" marker-end="url(#seta)" stroke-dasharray="8 6"/>
<text x="712" y="150" text-anchor="start" font-size="17" fill="#222">resumo de atendimento</text>
<text x="712" y="171" text-anchor="start" font-size="17" fill="#222">feito por profissional</text>
</svg>