# Roda os testes do back-end e do front-end em todo PR e em todo push
# na development e na main. É a evidência de "testes executados" (V&V).
name: Testes

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

jobs:
  back-end:
    name: Back-end (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar os testes
        run: python -m pytest tests -q
      - name: Conferir se não há segredo no código
        working-directory: .
        run: node backend/scripts/check-segredo.mjs

  front-end:
    name: Front-end (lint, build e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Rodar os testes
        run: node --test
